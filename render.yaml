services:
  - type: web
    name: shazam-recognition-service
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_KEY
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "31457280"
      - key: RECOGNIZE_TIMEOUT_SECONDS
        value: "45"
      - key: LOG_LEVEL
        value: "INFO"
    healthCheckPath: /health
